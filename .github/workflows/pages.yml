name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  published_studio:
    name: Verify advertised Studio release on PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The PyPI launch check is reported but does not block documentation and
    # demo deploys on package release timing (audit finding R-2, approved).
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned Playwright package without hooks
        working-directory: src/viewspec/host_verify_template
        run: npm ci --ignore-scripts
      - name: Install Chromium for the public release check
        working-directory: src/viewspec/host_verify_template
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Install and launch the exact homepage flow from PyPI
        run: python scripts/check_studio_release.py --published --out studio-public-release-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: studio-public-release-check
          path: studio-public-release-check.json
          if-no-files-found: error

  deploy:
    needs: published_studio
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demos
      - id: deployment
        uses: actions/deploy-pages@v4
