name: Agent Eval

# Model-in-the-loop measurement of the agent contract. It asks a model for IntentBundle and
# AppBundle JSON for every prompt in conformance/eval/prompts.json, validates each answer with the
# SDK, retries once with the correction prompt, and uploads the report. It is a separate,
# non-blocking workflow: it never runs on pull requests and no branch protection waits for it.
# The model id comes from the dispatch input or, on the schedule, from the repository variable
# VIEWSPEC_EVAL_MODEL. The key comes from the ANTHROPIC_API_KEY secret.
#
# A scheduled run does nothing until both are set. The preflight job says so in a notice, the eval
# job is skipped, and the run stays green. A manual run never skips: it always has a model id,
# because the input is required, and without the key the script exits 2 and the run is red, so a
# person who starts a run is told when it did not happen.

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:
    inputs:
      model:
        description: Model id to evaluate
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Check that the eval is configured
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_eval: ${{ steps.configured.outputs.run_eval }}

    steps:
      - name: Decide whether the eval runs
        id: configured
        env:
          VIEWSPEC_EVAL_MODEL: ${{ inputs.model || vars.VIEWSPEC_EVAL_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -n "$VIEWSPEC_EVAL_MODEL" ] || missing="the repository variable VIEWSPEC_EVAL_MODEL"
          [ -n "$ANTHROPIC_API_KEY" ] || missing="${missing:+$missing and }the secret ANTHROPIC_API_KEY"
          if [ -n "$missing" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "run_eval=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Agent eval skipped::The scheduled eval is not configured. Set $missing to turn it on."
          else
            echo "run_eval=true" >> "$GITHUB_OUTPUT"
          fi

  agent_eval:
    name: Model-in-the-loop agent contract eval
    needs: preflight
    if: ${{ needs.preflight.outputs.run_eval == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      VIEWSPEC_EVAL_MODEL: ${{ inputs.model || vars.VIEWSPEC_EVAL_MODEL }}
      VIEWSPEC_EVAL_OUT: ${{ github.workspace }}/.agent-eval-runs/current

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt ".[dev,agents]"

      - name: Record the plan without a model call
        run: python scripts/eval_agent_contract.py --dry-run --out "$VIEWSPEC_EVAL_OUT/plan"

      - name: Run the eval against the model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/eval_agent_contract.py --out "$VIEWSPEC_EVAL_OUT"

      - name: Upload the eval report
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: agent-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-eval-runs/current
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
