[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "viewspec"
dynamic = ["version"]
description = "Agent-native UI compiler. Agents describe intent; ViewSpec compiles concrete UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nigel Robinson" },
]
keywords = ["ui", "compiler", "semantic", "viewspec", "composition-ir", "protobuf", "declarative", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "protobuf>=6.31.1,<8",
    "PyYAML>=6.0",
]

[project.scripts]
viewspec = "viewspec.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "hypothesis>=6.100,<7",
    "ruff==0.15.22",
    "jsonschema>=4.18",
    "grpcio-tools==1.80.0",
    "pyright==1.1.414",
]
agents = [
    "mcp>=1.9.0,<2",
]

[project.urls]
Homepage = "https://github.com/nxrobins/viewspec"
Repository = "https://github.com/nxrobins/viewspec"
Issues = "https://github.com/nxrobins/viewspec/issues"

[tool.hatch.version]
path = "src/viewspec/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/viewspec"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/proto",
    "/tests",
    "/conformance",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 120
# Generated by scripts/regenerate_schema.py; protoc output is checked byte for byte in CI.
extend-exclude = ["src/viewspec/schema/viewspec_pb2.py", "src/viewspec/schema/viewspec_pb2.pyi"]

[tool.ruff.lint]
# Pyflakes and the pycodestyle errors, plus import order, modern-syntax upgrades,
# bugbear and simplification rules.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM102",  # nested ifs stay when they read as separate guards
    "SIM117",  # nested with statements stay when the contexts are unrelated
]

[tool.ruff.lint.per-file-ignores]
# Tests hand open file objects to the code under test and close them explicitly.
"tests/**" = ["SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: opt-in tests that install external toolchains and exercise real browser workflows",
]
