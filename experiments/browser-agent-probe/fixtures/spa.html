<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture SPA</title></head>
<body>
<div id="root"></div>
<script>
  // Everything the user sees is built by script, as in a client-rendered app.
  const rows = [["Signups", "1,204"], ["Churn", "2.1%"], ["Revenue", "$48K"]];
  const root = document.getElementById("root");
  root.innerHTML = `
    <nav><a href="#overview">Overview</a><a href="#reports">Reports</a></nav>
    <main>
      <h1>Metrics</h1>
      <table><tbody>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</tbody></table>
      <div class="toolbar">
        <div class="btn" tabindex="0">Export</div>
        <span class="chip" style="cursor: pointer">Last 30 days</span>
        <button>Refresh</button>
        <input type="text" aria-label="Filter metrics">
      </div>
      <p style="display: none"><button>Debug panel</button></p>
      <p>Updated <span id="clock">${new Date().toISOString()}</span></p>
    </main>`;
  document.querySelector(".btn").addEventListener("click", () => alert("export"));
  // State the user would have typed: it lives in properties, not in the markup.
  document.querySelector("[aria-label='Filter metrics']").value = "churn";
</script>
</body>
</html>
