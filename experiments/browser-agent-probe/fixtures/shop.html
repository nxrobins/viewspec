<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture shop</title></head>
<body>
<header>
  <nav>
    <a href="/">Home</a>
    <a href="/deals"><span>Deals</span></a>
    <a href="/cart" aria-label="Cart"><svg width="16" height="16"><circle cx="8" cy="8" r="6"/></svg></a>
    <span id="cart-count">0</span>
  </nav>
  <form action="/search">
    <label for="q">Search products</label>
    <!-- A site search with suggestions, as gov.uk has: a click on a suggestion runs the search. -->
    <input id="q" name="q" type="search" placeholder="Search products" role="combobox" aria-autocomplete="list"
           aria-expanded="false" aria-controls="q-list" autocomplete="off">
    <ul id="q-list" role="listbox" aria-label="Suggestions" hidden></ul>
    <select name="sort" aria-label="Sort by"><option>Price</option><option>Rating</option></select>
    <button type="submit">Search</button>
  </form>
</header>
<main>
  <h1>Desk lamps</h1>
  <ul class="results">
    <li><h2>Arc lamp</h2><p>$49.00</p><button>Add to cart</button></li>
    <li><h2>Clamp lamp</h2><p>$29.00</p><button>Add to cart</button></li>
    <li><h2>Globe lamp</h2><p>$65.00</p><button>Add to cart</button></li>
    <li><h2>Reading lamp</h2><p>$38.00</p><button>Add to cart</button></li>
  </ul>
  <label><input type="checkbox" name="instock"> In stock only</label>
  <div role="button" tabindex="0">Load more</div>
  <p role="status" id="cart-status"></p>
</main>
<footer><a href="/help">Help</a> <a href="https://brand.example/about">Brand site</a></footer>
<script>
  // "Add to cart" marks the item added, counts it, and says so in the status region.
  // "Load more" adds one more product.
  const list = document.querySelector(".results");
  let count = 0;
  function addable(button) {
    button.addEventListener("click", () => {
      const name = button.closest("li").querySelector("h2").textContent;
      button.textContent = "Added";
      button.disabled = true;
      count += 1;
      document.getElementById("cart-count").textContent = String(count);
      document.getElementById("cart-status").textContent = `${name} added to cart`;
    });
  }
  list.querySelectorAll("button").forEach(addable);

  // The search box suggests products as you type; a click on a suggestion submits the form at once,
  // which loads the results page.
  const q = document.getElementById("q");
  const qList = document.getElementById("q-list");
  q.addEventListener("input", () => {
    const typed = q.value.trim().toLowerCase();
    const names = [...list.querySelectorAll("h2")].map((heading) => heading.textContent);
    const found = names.filter((name) => typed && name.toLowerCase().includes(typed));
    qList.innerHTML = found.map((name) => `<li role="option">${name}</li>`).join("");
    qList.hidden = found.length === 0;
    q.setAttribute("aria-expanded", String(found.length > 0));
  });
  qList.addEventListener("click", (event) => {
    const option = event.target.closest("[role=option]");
    if (!option) return;
    q.value = option.textContent;
    q.form.requestSubmit();
  });
  document.querySelector("[role=button]").addEventListener("click", () => {
    const item = document.createElement("li");
    item.innerHTML = "<h2>Desk organizer</h2><p>$22.00</p><button>Add to cart</button>";
    list.appendChild(item);
    addable(item.querySelector("button"));
  });
</script>
</body>
</html>
