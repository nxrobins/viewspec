[package]
name = "viewspec-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "Experimental Rust CDP foundation for the ViewSpec browser bridge"

[dependencies]
libc = "0.2.189"
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
