<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Dispatch Reference</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #e9e9e4;
      color: #1d2623;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; background: #e9e9e4; }
    button { font: inherit; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 230px minmax(0, 1fr); }
    aside {
      min-width: 0;
      padding: 34px 24px;
      border-right: 1px solid #c9cbc3;
      background: #202c28;
      color: #f3f2e8;
    }
    .brand { display: flex; gap: 11px; align-items: center; margin-bottom: 42px; font-weight: 800; }
    .brand-mark { width: 28px; height: 28px; border-radius: 8px; background: #d9ff67; color: #202c28; display: grid; place-items: center; }
    nav { display: grid; gap: 8px; }
    nav a { padding: 11px 12px; border-radius: 9px; color: #bfc8c2; text-decoration: none; font-size: 14px; }
    nav a[aria-current="page"] { background: #34423d; color: #fff; }
    main { min-width: 0; padding: 42px clamp(22px, 5vw, 76px) 64px; }
    .topline { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
    .eyebrow { margin: 0 0 7px; color: #66706b; font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(40px, 5vw, 68px); font-weight: 500; line-height: .98; letter-spacing: -.045em; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #202c28; color: #d9ff67; font-weight: 800; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0 0 30px; }
    .metric { border-top: 2px solid #202c28; padding: 14px 3px 4px; }
    .metric strong { display: block; font-family: Georgia, serif; font-size: 33px; font-weight: 500; line-height: 1; }
    .metric span { color: #68716d; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
    .lane { margin: 25px 0; }
    .lane-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 10px; }
    h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .09em; }
    .risk { padding: 4px 8px; border-radius: 999px; background: #ff684f; color: #28110d; font-size: 11px; font-weight: 900; text-transform: uppercase; }
    .jobs { display: grid; gap: 10px; }
    article {
      min-width: 0;
      display: grid;
      grid-template-columns: 90px minmax(0, 1.6fr) minmax(130px, .65fr) 120px;
      gap: 20px;
      align-items: center;
      padding: 20px;
      border: 1px solid #c7cac1;
      border-radius: 14px;
      background: #f7f6ef;
      box-shadow: 0 1px 0 rgba(18, 30, 25, .05);
    }
    article.attention { border-color: #202c28; box-shadow: 5px 5px 0 #202c28; }
    .job-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 800; }
    .job-copy { min-width: 0; }
    .job-copy h3 { overflow-wrap: anywhere; margin: 0 0 5px; font-size: 16px; line-height: 1.25; }
    .job-copy p, .owner p { margin: 0; color: #69726e; font-size: 13px; }
    .owner strong { display: block; font-size: 13px; }
    .status { justify-self: end; padding: 7px 9px; border-radius: 7px; background: #e2e5dc; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 24px; }
    .actions button { min-height: 42px; border: 1px solid #202c28; border-radius: 9px; padding: 9px 13px; background: #202c28; color: #fff; cursor: pointer; font-weight: 800; }
    .actions button + button { background: transparent; color: #202c28; }
    .guide { margin-top: 12px; padding: 15px 17px; border-left: 4px solid #ff684f; background: #f7f6ef; }
    [hidden] { display: none !important; }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      aside { padding: 15px 18px; border-right: 0; }
      .brand { margin: 0 0 12px; }
      nav { display: flex; overflow-x: auto; }
      nav a { flex: 0 0 auto; }
      main { padding-top: 28px; }
      article { grid-template-columns: 72px minmax(0, 1fr) 110px; }
      .owner { grid-column: 2; }
      .status { grid-column: 3; grid-row: 1; }
    }
    @media (max-width: 520px) {
      main { padding: 24px 16px 44px; }
      .topline { align-items: start; }
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .metric strong { font-size: 28px; }
      article { grid-template-columns: 58px minmax(0, 1fr); gap: 11px; padding: 16px 13px; }
      .owner { grid-column: 2; }
      .status { grid-column: 2; justify-self: start; }
      .lane-head { align-items: start; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><span class="brand-mark">F</span><span>Fieldwork</span></div>
      <nav aria-label="Primary">
        <a href="#" aria-current="page">Dispatch</a>
        <a href="#">Technicians</a>
        <a href="#">Assets</a>
        <a href="#">Reports</a>
      </nav>
    </aside>
    <main>
      <header class="topline">
        <div><p class="eyebrow">Tuesday · July 22</p><h1>Field Dispatch</h1></div>
        <div class="avatar" aria-label="Signed in as NR">NR</div>
      </header>
      <section class="metrics" aria-label="Dispatch summary">
        <div class="metric"><strong id="unassigned">3</strong><span>Unassigned</span></div>
        <div class="metric"><strong>1</strong><span>At risk</span></div>
        <div class="metric"><strong>86%</strong><span>On time</span></div>
      </section>
      <div id="lanes"></div>
      <div class="actions" id="actions" hidden>
        <button type="button" id="show-guide">Show escalation guide</button>
        <button type="button" id="record-review">Record review</button>
      </div>
      <section class="guide" id="guide" hidden><strong>Escalation owner: Maya Chen</strong></section>
    </main>
  </div>
  <script>
    const step = Math.max(0, Math.min(4, Number(new URLSearchParams(location.search).get("step") || 0)));
    const status = step >= 1 ? "Awaiting assignment" : "Queued";
    const jobs = [
      {id:"J-204", place:"Harbor Clinic", title:"HVAC inspection", owner:"Maya Chen", time:"10:30 AM", status},
      {id:"J-205", place:"North Terminal", title: step >= 4 ? "Replace north terminal refrigeration sensor before evening medicine delivery window" : "Refrigeration sensor replacement", owner:"Owen Park", time:"12:45 PM", status:"At risk"},
      {id:"J-206", place:"Ridge School", title:"Safety inspection", owner:"Maya Chen", time:"2:15 PM", status}
    ];
    if (step >= 1) jobs.push({id:"J-207", place:"Lakeside Pharmacy", title:"Generator test", owner:"Unassigned", time:"4:30 PM", status});
    const card = (job, attention = false) => `<article class="${attention ? "attention" : ""}">
      <div class="job-id">${job.id}</div><div class="job-copy"><h3>${job.title}</h3><p>${job.place} · ${job.time}</p></div>
      <div class="owner"><strong>${job.owner}</strong><p>Field technician</p></div><div class="status">${job.status}</div></article>`;
    const lanes = document.querySelector("#lanes");
    if (step >= 2) {
      lanes.innerHTML = `<section class="lane"><div class="lane-head"><h2>Needs attention</h2><span class="risk">At risk</span></div><div class="jobs">${card(jobs[1], true)}</div></section>
        <section class="lane"><div class="lane-head"><h2>Route queue</h2></div><div class="jobs">${jobs.filter(job => job.id !== "J-205").map(job => card(job)).join("")}</div></section>`;
    } else {
      lanes.innerHTML = `<section class="lane"><div class="lane-head"><h2>Route queue</h2></div><div class="jobs">${jobs.map(job => card(job)).join("")}</div></section>`;
    }
    if (step >= 3) {
      document.querySelector("#actions").hidden = false;
      document.querySelector("#show-guide").addEventListener("click", () => { document.querySelector("#guide").hidden = false; });
      let reviewed = 0;
      document.querySelector("#record-review").addEventListener("click", event => { reviewed += 1; event.currentTarget.dataset.reviewed = String(reviewed); });
    }
  </script>
</body>
</html>
